## =====================================================================
## PRODUCCIÓN (JAR compilado con ./mvnw clean package -Pproduction).
## Credenciales por variables de entorno; sin recarga, sin navegador, logs a archivo.
##   DB_URL       (opcional, por defecto jdbc:mysql://localhost:3307/db_colmadom)
##   DB_USER      (opcional, por defecto root)
##   DB_PASSWORD  (obligatoria)
## =====================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/db_colmadom}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

## Vaadin en modo producción (el frontend ya viene compilado dentro del JAR)
vaadin.launch-browser=false
vaadin.devmode.enabled=false
vaadin.live-reload.enabled=false
spring.devtools.restart.enabled=false

## Logs: solo INFO de la app, guardados en logs/colmadom.log (rotación diaria, 30 días)
logging.level.root=INFO
logging.level.com.maxsoft.application=INFO
logging.file.name=logs/colmadom.log
logging.logback.rollingpolicy.max-history=30

## No exponer detalles de errores al navegador
server.error.include-stacktrace=never
server.error.include-message=never
