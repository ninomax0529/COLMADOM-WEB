## =====================================================================
## Configuración COMÚN a todos los entornos.
## Lo específico va en application-dev.properties / application-prod.properties.
## =====================================================================

## Perfil activo: lo pone Maven al compilar (dev por defecto, prod con -Pproduction).
## Se puede forzar con la variable de entorno SPRING_PROFILES_ACTIVE=dev|prod.
spring.profiles.active=@spring.profiles.active@

server.port=${PORT:8082}
spring.mustache.check-template-location=false

## MySQL (las credenciales van en cada perfil)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

vaadin.allowed-packages=com.maxsoft.application

## Flyway: aplica al arrancar los scripts de src/main/resources/db/migration (V<AAAAMMDD>__nombre.sql).
## La BD existente se marca como versión 20261112 (ya tiene aplicados los scripts de sql/ hasta esa fecha).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20261112
spring.flyway.baseline-description=Esquema base (dump + scripts sql/ hasta 2026-11-12)

logging.level.org.atmosphere=warn
